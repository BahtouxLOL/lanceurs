<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LOCKED IN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#ECEADB">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ECEADB; color: #0A0A0A; font-family: system-ui, sans-serif; text-align: center; }
  img { width: 120px; height: 120px; border-radius: 28px; }
  p { max-width: 30ch; line-height: 1.5; margin: 20px auto; }
  button, a { font: inherit; color: inherit; }
  button { padding: 12px 22px; border-radius: 999px; border: 1px solid currentColor; background: transparent; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="">
  <p id="msg">Ouverture de LOCKED IN…</p>
  <button id="install" hidden>Installer sur l’écran d’accueil</button>
  <p id="help" hidden>Menu Chrome (⋮), puis « Ajouter à l’écran d’accueil », puis « Installer ».<br><a href="https://claude.ai/code/artifact/7762e931-08cb-4d35-a8a5-d93c5d1aff7f">Ouvrir sans installer</a></p>
</main>
<script>
  var target = "https://claude.ai/code/artifact/7762e931-08cb-4d35-a8a5-d93c5d1aff7f";
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var standalone = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches;
  if (standalone) {
    location.replace(target);
  } else {
    document.getElementById('msg').textContent = 'Lanceur de LOCKED IN. Installe-le pour avoir son icône sur ton écran d’accueil.';
    document.getElementById('help').hidden = false;
    var deferred = null, btn = document.getElementById('install');
    addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; btn.hidden = false; });
    btn.addEventListener('click', function () { if (deferred) { deferred.prompt(); deferred = null; btn.hidden = true; } });
  }
</script>
</body>
</html>
